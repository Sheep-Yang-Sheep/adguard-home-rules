name: 自动合并规则

on:
  # 每 4 小时运行一次（UTC）。
  # 刻意避开整点：GitHub 的 cron 在 :00 最拥堵，经常被延迟甚至直接丢弃。
  #           主 cron  : 00:07 / 04:07 / 08:07 / 12:07 / 16:07 / 20:07（北京时间 08:07 / 12:07 …）
  #           补跑 cron: 奇数小时 :23，与主 cron 交错
  #
  # 为什么要两条：GitHub 的定时任务只是 best-effort，实测建仓 20 小时内 5 个时点只跑了
  # 1 次，其余连 run 对象都没创建。而且丢弃是「成簇」的（连续丢 4 次才成功 1 次），
  # 所以补跑要摊到不同小时，而不是在同一小时里多打几次 —— 同一小时的两次大概率一起丢。
  #
  # 两条交错后实际是 18 次/天，最长间隔 2 小时、最短 44 分钟。
  # 多出来的运行不会制造垃圾提交：规则没变时「提交变更」步骤会跳过心跳提交。
  # 实测近 11 次提交只让仓库涨了 21KB（dist 的增量压缩极好），翻倍频率的体积代价可忽略。
  schedule:
    - cron: '7 */4 * * *'
    - cron: '23 1-23/2 * * *'
  # 支持手动触发：仓库 Actions 页面 → 自动合并规则 → Run workflow
  # force=true 只用于救急：某个源已确认永久下线、但还没从 sources.json 里删掉时，
  # 临时允许「缺源也发布」。正常运行不需要它。
  workflow_dispatch:
    inputs:
      force:
        description: '忽略上游抓取失败（缺源也发布，救急用）'
        type: boolean
        default: false
  # 外部定时器兜底：GitHub 自己的 cron 丢单时，这是唯一能让更新准点的办法。
  # 实测本仓库 32 小时内应触发约 30 次、实际只跑了 2 次（~7%），所以这条路径不是可选项。
  # 现成的实现放在 ops/cron-trigger（Cloudflare Worker + Cron Trigger），照 README 部署即可。
  # 手工调用则是：（需要 Contents: Read and write，classic 令牌勾 repo 即可）
  #   curl -X POST \
  #     -H "Authorization: Bearer <token>" \
  #     -H "Accept: application/vnd.github+json" \
  #     https://api.github.com/repos/<owner>/<repo>/dispatches \
  #     -d '{"event_type":"update-rules","client_payload":{"force":"false"}}'
  # 详见 README「六、常见问题 · 说好每 4 小时更新」。
  repository_dispatch:
    types: [update-rules]
  # 修改配置或代码后立即跑一次验证
  push:
    branches: [main]
    paths:
      - 'sources.json'
      - 'allowlist.txt'
      - 'src/**'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: merge-rules
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    # 略大于 src/index.js 里的 fetchBudgetMs（12 分钟），给解析/提交留余量
    timeout-minutes: 25

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 单元测试
        run: node --test src/test.js

      - name: 抓取并合并规则
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.event.repository.default_branch }}
          # 发布闸门在 src/index.js 里：配置中任何一个上游完全没有可用地址，
          # 整个过程直接失败、一个文件都不写（宁可停更，也不发布残缺规则）。
          # 手工触发走 workflow_dispatch 的 inputs.force，
          # 外部定时器（ops/cron-trigger）走 repository_dispatch 的 client_payload.force。
          FORCE: ${{ github.event.inputs.force || github.event.client_payload.force || 'false' }}
        run: node src/index.js

      - name: 校验输出
        run: |
          set -euo pipefail
          FILE=dist/adguard-home-rules.txt
          test -f "$FILE" || { echo "::error::规则文件未生成"; exit 1; }

          SIZE=$(stat -c%s "$FILE")
          # 只统计纯域名屏蔽规则，与 status.json 的 block 口径一致
          LINES=$(grep -cE '^\|\|[^$*]+\^$' "$FILE" || true)
          echo "文件大小: $SIZE 字节 / 屏蔽规则: $LINES 条"

          # 只保留「文件根本不像一份规则」的兜底判断。
          # 原先的「比上轮少 20% 就拒绝发布」已移除：增删单个规则源、或上游合法瘦身
          # 都会让总数发生正常变化，那种熔断会让订阅长期停更，而且要靠人工 force 才能解卡。
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::规则文件异常偏小（$SIZE 字节），疑似抓取失败"
            exit 1
          fi

      - name: 提交变更
        env:
          # 只有定时任务才需要节流；手工触发 / push / dispatch 一律照常提交
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 距上次提交多久（秒）。补跑 cron 只负责「多给一次抓取机会」，
          # 规则没变时不必再刷一次心跳，否则一天会多出一倍纯时间戳提交。
          LAST_TS=$(git log -1 --format=%ct 2>/dev/null || echo 0)
          AGE=$(( $(date +%s) - LAST_TS ))

          git add -A

          if git diff --cached --quiet; then
            echo "本次无变更，跳过提交"
            exit 0
          fi

          DIST=dist/adguard-home-rules.txt
          if git diff --cached --name-only | grep -qx "$DIST"; then
            KIND=rules
          else
            KIND=heartbeat
          fi

          # 只对「定时任务 + 规则没变 + 距上次提交不足 2 小时」这一种组合节流。
          # 以前没判断触发方式，结果改完 README 模板推上来，这一次运行因为 dist 没变
          # 被当成心跳跳过，改动白跑（run #16 就是这么丢的）。
          if [ "$KIND" = "heartbeat" ] && [ "$AGE" -lt 7200 ] && [ "$EVENT" = "schedule" ]; then
            echo "规则未变，且距上次提交只有 $((AGE / 60)) 分钟（< 120），跳过心跳提交"
            exit 0
          fi

          TS=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')
          if [ "$KIND" = "rules" ]; then
            git commit -m "chore(rules): 更新合并规则 ${TS} (北京时间)"
          else
            # 单独标记，便于在历史里区分「规则真的变了」和「只是心跳」
            git commit -m "chore(heartbeat): 记录运行时间 ${TS} (北京时间)"
          fi

          BRANCH="${{ github.event.repository.default_branch }}"
          for i in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then
              echo "推送成功（$KIND）"
              exit 0
            fi
            echo "推送失败（第 $i 次），变基后重试"
            git pull --rebase --autostash origin "$BRANCH" || true
            sleep 5
          done

          echo "::error::推送连续失败，请检查分支是否被保护或存在冲突"
          exit 1
