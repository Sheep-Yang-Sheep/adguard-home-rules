name: 自动合并规则

on:
  # 每 4 小时运行一次（UTC）。
  # 刻意避开整点：GitHub 的 cron 在 :00 最拥堵，经常被延迟甚至直接丢弃，
  # 用 :17 / :07 这类零散分钟能显著提高准时率。
  # 对应北京时间约 00:07 / 04:07 / 08:07 / 12:07 / 16:07 / 20:07。
  schedule:
    - cron: '7 */4 * * *'
  # 支持手动触发：仓库 Actions 页面 → 自动合并规则 → Run workflow
  # force=true 可跳过「比上轮少 20% 就拒绝发布」的熔断，用于上游合法瘦身后解卡
  workflow_dispatch:
    inputs:
      force:
        description: '跳过 20% 跌幅熔断，强制发布本次结果'
        type: boolean
        default: false
  # 修改配置或代码后立即跑一次验证
  push:
    branches: [main]
    paths:
      - 'sources.json'
      - 'src/**'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: merge-rules
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    # 略大于 src/index.js 里的 fetchBudgetMs（12 分钟），给解析/提交留余量
    timeout-minutes: 25

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 单元测试
        run: node --test src/test.js

      - name: 记录上轮基线
        id: baseline
        run: |
          PREV=0
          if [ -f status.json ]; then
            PREV=$(node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync('status.json','utf8')).block || 0))")
          fi
          echo "block=$PREV" >> "$GITHUB_OUTPUT"
          echo "上轮屏蔽规则基线: $PREV 条"

      - name: 抓取并合并规则
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.event.repository.default_branch }}
        run: node src/index.js

      - name: 校验输出
        env:
          PREV_BLOCK: ${{ steps.baseline.outputs.block }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -euo pipefail
          FILE=dist/adguard-home-rules.txt
          test -f "$FILE" || { echo "::error::规则文件未生成"; exit 1; }

          SIZE=$(stat -c%s "$FILE")
          # 只统计纯域名屏蔽规则，与 status.json 的 block 口径一致；
          # 以前用 '^||' 会把 400 多条通配规则也算进来，和基线不是同一个数
          LINES=$(grep -cE '^\|\|[^$*]+\^$' "$FILE" || true)
          echo "文件大小: $SIZE 字节 / 屏蔽规则: $LINES 条 / 上轮: ${PREV_BLOCK:-0} 条"

          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::规则文件异常偏小（$SIZE 字节），疑似抓取失败"
            exit 1
          fi

          # 相对上轮掉 20% 以上就拒绝发布：宁可这次不更新，也不要推一份残缺规则
          if [ "${PREV_BLOCK:-0}" -gt 100000 ]; then
            MIN=$(( PREV_BLOCK * 80 / 100 ))
            if [ "$LINES" -lt "$MIN" ]; then
              if [ "$FORCE" = "true" ]; then
                echo "::warning::屏蔽规则数 $LINES 条，低于上轮 $PREV_BLOCK 条的 80%，但已指定 force=true，继续发布"
              else
                echo "::error::屏蔽规则数 $LINES 条，比上轮 $PREV_BLOCK 条少 20% 以上，拒绝发布"
                echo "::error::若确认是上游合法瘦身，请到 Actions 页面手动 Run workflow 并勾选 force"
                exit 1
              fi
            fi
          fi

      - name: 提交变更
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "本次无变更，跳过提交"
            exit 0
          fi

          TS=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')
          git commit -m "chore(rules): 更新合并规则 ${TS} (北京时间)"

          BRANCH="${{ github.event.repository.default_branch }}"
          for i in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then
              echo "推送成功"
              exit 0
            fi
            echo "推送失败（第 $i 次），变基后重试"
            git pull --rebase --autostash origin "$BRANCH" || true
            sleep 5
          done

          echo "::error::推送连续失败，请检查分支是否被保护或存在冲突"
          exit 1
