#:schema node_modules/wrangler/config-schema.json

name = "adguard-rules-trigger"
main = "worker.js"
compatibility_date = "2026-11-01"

# 每 4 小时的第 23 分钟触发一次（Cloudflare 的 cron 一律按 UTC 解释）。
#
# 刻意与仓库里 GitHub Actions 的两条 cron 错开：
#   GitHub 主跑 :07 / 补跑 :37   ←  两条都靠 GitHub 调度器，都可能被丢
#   Worker 兜底 :23              ←  不经过 GitHub 调度器
# 三条互不重叠，任意一条活下来都能把更新推出去。多出来的一两次运行不会产生多余提交：
# 工作流里规则没变且距上次提交不足 2 小时时会跳过心跳提交。
[triggers]
crons = ["23 */4 * * *"]

# 密钥不要写在这里，用 wrangler secret put 写入（见 README）
#   wrangler secret put GH_TOKEN
#   wrangler secret put TRIGGER_KEY
